name: Update booking history

on:
  schedule:
    - cron: '17 */3 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch iCal and update history
        run: python3 .github/scripts/update_history.py

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/history.json data/feed.ics
          git diff --staged --quiet && echo "No changes" || (
            git commit -m "chore: update booking history [skip ci]"
            git push
          )
