name: Update booking history

on:
  schedule:
    - cron: '17 */3 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Jen na zkoušku — spočítat a vypsat do logu, nic nezapsat'
        type: boolean
        default: false

permissions:
  contents: write

# Cron a ruční spuštění se nesmí potkat: oba by spočítaly data/ nad stejným checkoutem
# a druhý push by skončil jako non-fast-forward. Nový běh počká, rozběhnutý se neruší.
concurrency:
  group: update-history
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    # Výchozích 360 minut by zaseknutý git fetch/push držel runner půl dne.
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          # Celá historie: regresní test v test_update_history.py porovnává současný
          # skript s verzí před přechodem na čtyři feedy (`git show <starý commit>`).
          # S mělkým klonem (depth=1) ten commit v runneru není — test se pak přeskočí
          # a hub mode nikdo neohlídá. Repo je malé, plný klon nic nestojí.
          fetch-depth: 0

      # Přišpendlená verze: systémový python3 se mění s obrazem runneru.
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run tests
        run: python3 .github/scripts/test_update_history.py

      - name: Fetch iCal and update history
        # Feed URLs hold private keys — they live in repo secrets, never in the repo.
        # Unset secrets arrive as empty strings and the script simply skips that feed:
        # with only ICAL_URL_ECHALUPY (or its legacy fallback) it stays in HUB MODE and
        # behaves exactly as before. Add the other three to switch to MULTI MODE.
        env:
          ICAL_URL_AIRBNB:    ${{ secrets.ICAL_URL_AIRBNB }}
          ICAL_URL_BOOKING:   ${{ secrets.ICAL_URL_BOOKING }}
          ICAL_URL_FEWO:      ${{ secrets.ICAL_URL_FEWO }}
          ICAL_URL_MEGAUBYTKO: ${{ secrets.ICAL_URL_MEGAUBYTKO }}
          ICAL_URL_ECHALUPY:  ${{ secrets.ICAL_URL_ECHALUPY }}
        # Zkušební běh: ruční spuštění s dry_run, nebo repo proměnná CALENDAR_DRY_RUN=1
        # (drží na zkoušce i cron — pro první běh po přidání dalších feedů, viz CLAUDE.md).
        # V tu dobu se data/ nemění a krok s commitem nemá co commitnout.
        # Cron na zkoušce ale skončí ČERVENĚ: 28. 9.–6. 10. 2026 zůstala proměnná zapnutá
        # 8 dní, běhy byly zelené a kalendář přitom nic nezapisoval (úklid, /sprava/,
        # blokace přímých prodejů na platformách). Neúspěšný běh pošle GitHub e-mailem.
        run: |
          if [ "${{ inputs.dry_run }}" = "true" ] || [ "${{ vars.CALENDAR_DRY_RUN }}" = "1" ]; then
            echo "::notice::Zkušební běh (--dry-run) — nic se nezapisuje"
            python3 .github/scripts/update_history.py --dry-run
            if [ "${{ github.event_name }}" = "schedule" ]; then
              echo "::error::Repo proměnná CALENDAR_DRY_RUN=1 drží na zkoušce i cron — kalendář NEZAPISUJE (úklid, /sprava/ i výstupní feedy stojí). Po přečtení logu ji smaž."
              exit 1
            fi
          else
            python3 .github/scripts/update_history.py
          fi

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/history.json data/feed.ics data/out
          git diff --staged --quiet && echo "No changes" || (
            git commit -m "chore: update booking history [skip ci]"
            # Kdyby na větvi mezitím přibyl commit (sloučený PR, ruční smazání ducha),
            # push by byl odmítnut a aktualizace by propadla do dalšího běhu.
            git pull --rebase origin ${{ github.ref_name }}
            git push
          )
